<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio CK - Ambientación Celular Kits</title>
    
    <!-- SDKs de Firebase (Compatibles para HTML estático sin dependencias npm) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --ck-blue: #002B9A;
            --ck-orange: #FF6600;
            --ck-white: #FFFFFF;
            --bg-dark: #0b132b;
            --card-bg: #1c2541;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        /* LOGO CELULAR KITS */
        .brand-logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .brand-logo-text {
            font-size: 2.2rem;
            font-weight: 900;
            font-style: italic;
            color: var(--ck-blue);
            text-shadow: 
                -2px -2px 0 var(--ck-orange),  
                 2px -2px 0 var(--ck-orange),
                -2px  2px 0 var(--ck-orange),
                 2px  2px 0 var(--ck-orange),
                 0px  0px 10px rgba(255, 102, 0, 0.8);
            letter-spacing: -1px;
            display: inline-block;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 24px;
            border-radius: 12px;
            border: 3px solid var(--ck-orange);
        }

        .brand-logo-text span {
            color: var(--ck-orange);
            background: var(--ck-blue);
            padding: 2px 8px;
            border-radius: 50%;
            margin-left: 5px;
            border: 2px solid white;
        }

        /* LOGIN */
        .login-card {
            background: var(--card-bg);
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            text-align: center;
            max-width: 400px;
            margin: 40px auto;
            border: 2px solid rgba(0, 43, 154, 0.5);
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1.5px solid #3b4d61;
            background: #0b132b;
            color: white;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        button {
            background: var(--ck-orange);
            color: var(--ck-white);
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.3);
        }

        button:hover { 
            background: #e65c00; 
            transform: translateY(-2px);
        }

        .view-section { display: none; }
        .view-section.active { display: block; }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--ck-blue);
            padding-bottom: 15px;
        }

        /* REPRODUCTOR */
        .player-box {
            text-align: center;
            padding: 30px 20px;
            border: 2px solid var(--ck-blue);
        }

        .track-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 800;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-music { 
            background: rgba(0, 43, 154, 0.3); 
            color: #38bdf8; 
            border: 1.5px solid var(--ck-blue); 
        }
        
        .badge-ad { 
            background: rgba(255, 102, 0, 0.25); 
            color: #ff9d5c; 
            border: 1.5px solid var(--ck-orange); 
        }

        .btn-play-large {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            font-size: 2.5rem;
            margin: 25px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--ck-orange);
            color: white;
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.5);
            border: 4px solid var(--ck-white);
        }

        .btn-play-large:hover {
            transform: scale(1.05);
            background: #e65c00;
        }

        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        ul { list-style: none; padding: 0; }
        li {
            background: #0b132b;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--ck-orange);
        }

        .btn-delete {
            background: #ef4444;
            color: white;
            width: auto;
            padding: 4px 10px;
            font-size: 0.8rem;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- PANTALLA DE ACCESO -->
        <div id="viewLogin" class="login-card">
            <div class="brand-logo-container">
                <div class="brand-logo-text">CELULAR <span>KITS</span></div>
            </div>
            <h2 style="color: var(--ck-white); margin-top: 10px;">📻 Radio CK</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Sistema de Ambientación de Puntos de Venta</p>
            
            <select id="loginRole">
                <option value="tienda">📍 Punto de Venta (Tienda)</option>
                <option value="admin">🔒 Administrador General</option>
            </select>
            <input type="password" id="loginPass" placeholder="Contraseña de acceso">
            <button onclick="autenticar()">Ingresar al Sistema</button>
            <p id="errorMsg" style="color: #ef4444; font-size: 0.85rem; display: none; margin-top: 10px; font-weight: bold;"></p>
        </div>

        <!-- VISTA PUNTO DE VENTA -->
        <div id="viewTienda" class="view-section">
            <div class="header">
                <div class="brand-logo-text" style="font-size: 1.2rem; padding: 4px 12px;">CELULAR <span>KITS</span></div>
                <button onclick="cerrarSesion()" style="width:auto; padding: 6px 14px; background:#475569;">Salir</button>
            </div>

            <div class="card player-box">
                <div id="trackBadge" class="track-badge badge-music">🎵 MÚSICA DE FONDO</div>
                <h1 id="trackTitle" style="margin: 10px 0; color: var(--ck-white);">Sin música programada</h1>
                <p id="trackStatus" style="color: var(--text-muted);">Presiona Play para iniciar la transmisión</p>
                
                <button id="btnPlay" class="btn-play-large" onclick="togglePlay()">▶</button>

                <div style="margin-top: 25px; width: 65%; margin-left: auto; margin-right: auto;">
                    <label style="font-size: 0.85rem; color: var(--text-muted); font-weight: bold;">Volumen del Local:</label>
                    <input type="range" id="volControl" min="0" max="1" step="0.05" value="0.8" onchange="cambiarVolumen(this.value)">
                </div>
            </div>
        </div>

        <!-- VISTA ADMINISTRADOR -->
        <div id="viewAdmin" class="view-section">
            <div class="header">
                <div>
                    <h3 style="margin: 0; color: var(--ck-orange);">🔒 Panel de Control - Radio CK</h3>
                </div>
                <button onclick="cerrarSesion()" style="width:auto; padding: 6px 14px; background:#475569;">Salir</button>
            </div>

            <div class="card">
                <h4 style="color: var(--ck-white); margin-top: 0;">⚙️ Reglas de Programación</h4>
                <label style="font-size: 0.9rem; color: var(--text-muted);">Insertar 1 Anuncio promocional cada cuántas canciones:</label>
                <div class="form-row" style="margin-top: 8px;">
                    <input type="number" id="cfgFrecuencia" value="3" min="1" max="10" style="width: 100px;">
                    <button onclick="guardarFrecuencia()" style="width: auto; padding: 0 20px;">Guardar Regla</button>
                </div>
            </div>

            <div class="card">
                <h4 style="color: var(--ck-white); margin-top: 0;">🎵 Biblioteca de Música Activa</h4>
                <div class="form-row">
                    <input type="text" id="musicTitle" placeholder="Título de la Canción">
                    <input type="text" id="musicUrl" placeholder="URL Raw de GitHub (.mp3)">
                    <button onclick="agregarAudio('musica')" style="width: 120px;">+ Agregar</button>
                </div>
                <ul id="listMusica"></ul>
            </div>

            <div class="card">
                <h4 style="color: var(--ck-white); margin-top: 0;">📢 Anuncios Promocionales Celular Kits</h4>
                <div class="form-row">
                    <input type="text" id="adTitle" placeholder="Título del Anuncio / Promoción">
                    <input type="text" id="adUrl" placeholder="URL Raw de GitHub (.mp3)">
                    <button onclick="agregarAudio('anuncio')" style="width: 120px;">+ Agregar</button>
                </div>
                <ul id="listAnuncios"></ul>
            </div>
        </div>

    </div>

    <!-- REPRODUCTOR DE AUDIO OCULTO -->
    <audio id="audioEngine"></audio>

<script>
// CONFIGURACIÓN OFICIAL DE FIREBASE RADIO CK
const firebaseConfig = {
  apiKey: "AIzaSyAwmObHWQd1nmI7cMIcMm8hf5pOppjNfqw",
  authDomain: "radio-ck.firebaseapp.com",
  databaseURL: "https://radio-ck-default-rtdb.firebaseio.com",
  projectId: "radio-ck",
  storageBucket: "radio-ck.firebasestorage.app",
  messagingSenderId: "634826147982",
  appId: "1:634826147982:web:68184ac1b2be735559a1df"
};

// Inicializar Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Credenciales
const PASS_ADMIN = "admin123";
const PASS_TIENDA = "tienda123";

let configuracion = { frecuenciaAnuncios: 3 };
let playlistMusica = [];
let playlistAnuncios = [];

let contadorCanciones = 0;
let indiceMusica = 0;
let indiceAnuncio = 0;
let reproduciendoAnuncio = false;
let isPlaying = false;

const audio = document.getElementById("audioEngine");

// ESCUCHAR CAMBIOS EN TIEMPO REAL
db.ref("radio_ck").on("value", (snapshot) => {
    const data = snapshot.val();
    if (data) {
        configuracion.frecuenciaAnuncios = data.frecuencia || 3;
        const cfgInput = document.getElementById("cfgFrecuencia");
        if (cfgInput) cfgInput.value = configuracion.frecuenciaAnuncios;

        playlistMusica = data.musica ? Object.keys(data.musica).map(k => ({ id: k, ...data.musica[k] })) : [];
        playlistAnuncios = data.anuncios ? Object.keys(data.anuncios).map(k => ({ id: k, ...data.anuncios[k] })) : [];

        renderAdmin();
    }
});

// AUTENTICACIÓN
function autenticar() {
    const rol = document.getElementById("loginRole").value;
    const passInput = document.getElementById("loginPass").value.trim();
    const errorMsg = document.getElementById("errorMsg");

    errorMsg.style.display = "none";

    if (rol === "admin" && passInput === PASS_ADMIN) {
        mostrarPantalla("viewAdmin");
        renderAdmin();
    } else if (rol === "tienda" && passInput === PASS_TIENDA) {
        mostrarPantalla("viewTienda");
    } else {
        errorMsg.innerText = "❌ Contraseña incorrecta";
        errorMsg.style.display = "block";
    }
}

function mostrarPantalla(idView) {
    document.getElementById("viewLogin").style.display = "none";
    document.querySelectorAll(".view-section").forEach(v => v.classList.remove("active"));
    document.getElementById(idView).classList.add("active");
}

function cerrarSesion() {
    audio.pause();
    isPlaying = false;
    document.getElementById("btnPlay").innerText = "▶";
    document.getElementById("viewLogin").style.display = "block";
    document.querySelectorAll(".view-section").forEach(v => v.classList.remove("active"));
    document.getElementById("loginPass").value = "";
}

// FUNCIONES ADMINISTRADOR
function guardarFrecuencia() {
    const freq = parseInt(document.getElementById("cfgFrecuencia").value);
    db.ref("radio_ck/frecuencia").set(freq);
    alert("Regla de frecuencia actualizada");
}

function agregarAudio(tipo) {
    let tituloInput, urlInput, nodeRef;

    if (tipo === 'musica') {
        tituloInput = document.getElementById("musicTitle");
        urlInput = document.getElementById("musicUrl");
        nodeRef = "radio_ck/musica";
    } else {
        tituloInput = document.getElementById("adTitle");
        urlInput = document.getElementById("adUrl");
        nodeRef = "radio_ck/anuncios";
    }

    const titulo = tituloInput.value.trim();
    const url = urlInput.value.trim();

    if (!titulo || !url) {
        alert("Completa el título y la URL del audio.");
        return;
    }

    db.ref(nodeRef).push({ titulo, url });

    tituloInput.value = "";
    urlInput.value = "";
}

function eliminarAudio(tipo, id) {
    const path = tipo === 'musica' ? `radio_ck/musica/${id}` : `radio_ck/anuncios/${id}`;
    db.ref(path).remove();
}

function renderAdmin() {
    const listM = document.getElementById("listMusica");
    const listA = document.getElementById("listAnuncios");

    if (listM) {
        listM.innerHTML = playlistMusica.map(m => `
            <li>
                <span>🎵 ${m.titulo}</span>
                <button class="btn-delete" onclick="eliminarAudio('musica', '${m.id}')">Eliminar</button>
            </li>
        `).join('');
    }

    if (listA) {
        listA.innerHTML = playlistAnuncios.map(a => `
            <li>
                <span>📢 ${a.titulo}</span>
                <button class="btn-delete" onclick="eliminarAudio('anuncio', '${a.id}')">Eliminar</button>
            </li>
        `).join('');
    }
}

// MOTOR DE REPRODUCCIÓN
function togglePlay() {
    if (playlistMusica.length === 0) {
        alert("Aún no hay canciones cargadas en la lista por el Administrador.");
        return;
    }

    if (isPlaying) {
        audio.pause();
        isPlaying = false;
        document.getElementById("btnPlay").innerText = "▶";
        document.getElementById("trackStatus").innerText = "Pausado";
    } else {
        if (!audio.src) {
            cargarSiguientePista();
        } else {
            audio.play();
        }
        isPlaying = true;
        document.getElementById("btnPlay").innerText = "⏸";
        document.getElementById("trackStatus").innerText = "Sintonizando Radio CK...";
    }
}

function cargarSiguientePista() {
    if (contadorCanciones >= configuracion.frecuenciaAnuncios && playlistAnuncios.length > 0) {
        reproduciendoAnuncio = true;
        let anuncio = playlistAnuncios[indiceAnuncio];
        audio.src = anuncio.url;
        actualizarUIPlayer(anuncio.titulo, true);
        indiceAnuncio = (indiceAnuncio + 1) % playlistAnuncios.length;
        contadorCanciones = 0; 
    } else {
        reproduciendoAnuncio = false;
        let cancion = playlistMusica[indiceMusica];
        audio.src = cancion.url;
        actualizarUIPlayer(cancion.titulo, false);
        indiceMusica = (indiceMusica + 1) % playlistMusica.length;
        contadorCanciones++;
    }
    audio.play().catch(e => console.log("Autoplay prevenido por navegador:", e));
}

audio.onended = function() { cargarSiguientePista(); };

function actualizarUIPlayer(titulo, esAnuncio) {
    document.getElementById("trackTitle").innerText = titulo;
    const badge = document.getElementById("trackBadge");
    if (badge) {
        if (esAnuncio) {
            badge.innerText = "📢 ANUNCIO CELULAR KITS";
            badge.className = "track-badge badge-ad";
        } else {
            badge.innerText = "🎵 MÚSICA DE FONDO";
            badge.className = "track-badge badge-music";
        }
    }
}

function cambiarVolumen(val) { audio.volume = val; }
</script>
</body>
</html>
